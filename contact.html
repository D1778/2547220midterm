        <h2 class="font-serif text-3xl text-white mb-10">GEOLOCATION OF THE COFFEE</h2>
<iframe width="425" height="350" src="https://www.openstreetmap.org/export/embed.html?bbox=72.54821777343751%2C12.087667262738698%2C79.61242675781251%2C15.728813770533979&amp;layer=mapnik" style="border: 1px solid black"></iframe><br/><small><a href="https://www.openstreetmap.org/?#map=8/13.915/76.080">View Larger Map</a></small>

        <p>Latitude: <span id="lat" ></span></p>
         <p>Longitude: <span id="lon" ></span></p>
          <p>TimeStamp: <span id="timestamp" ></span></p>
          <div id="error"></div>
    </main>

    <script>
        window.onload = function(){
            if(navigator.geolocation){
                navigator.geolocation.getCurrentPosition(getPositions, showError);
            }else {
                console.log("Browser doesn't support Geolocation")                
            }
        }
      function getPositions(position){
            document.getElementById("lat").innerText= position.coords.latitude;
            document.getElementById("lon").innerText= position.coords.longitude;
            document.getElementById("timestamp").innerText=new Date(position.timestamp)
        }
    function showError(error){
            let msg="";
            switch(error.code){
                case error.PERMISSION_DENIED:
                    msg="User Denied Permission";
                    break;
                case error.POSITION_UNAVAILABLE:
                    msg="Not able to fetch the user position";
                    break;
                case error.TIMEOUT:
                    msg="Time out";
                    break;
                case error.UNKNOWN_ERROR:
                    msg="Unknown Error";
                    break;
            }
            displayError(msg)
        }

        function displayError(msg){
            document.getElementById("error").innerText=msg;
        }
    </script>
</div>
